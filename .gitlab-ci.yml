# App 冷启测速 — GitLab CI/CD
#
# 当前状态：配置就绪，等待 Windows Runner 注册后自动生效。
# 触发方式：git tag vX.Y.Z && git push 7k7k --tags
# Runner 配置：详见 docs/gitlab-runner-setup.md

stages:
  - build

variables:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

cache:
  key: deps-v1
  paths:
    - node_modules/
    - python-embed/

build:
  stage: build
  tags:
    - windows
  only:
    - tags
  script:
    - powershell -ExecutionPolicy Bypass -File scripts/ci-build.ps1
  artifacts:
    paths:
      - release/*.exe
      - publish/*.zip
      - publish/v*/*.docx
    expire_in: 30 days
